<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- media="print" + onload swap: a stylesheet link is render-blocking by default
         (the browser waits for it before first paint) even with font-display:swap,
         which only affects how the *font* swaps in, not whether the *stylesheet
         download* blocks rendering. This is the standard trick to load it
         asynchronously instead — combined with the static splash below, first
         paint no longer waits on a network round trip to Google Fonts. -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Oswald:wght@400;500;600;700&display=swap"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"
      rel="stylesheet"
      media="print"
      onload="this.media='all'"
    />
    <style>
      /* Inline, zero-dependency splash — visible the instant the HTML parses,
         before the JS bundle or any stylesheet has loaded. Removed automatically
         once React mounts (see main.tsx). Fixes "blank white page while loading". */
      #initial-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f7f9fb;
        font-family: ui-sans-serif, system-ui, sans-serif;
      }
      #initial-splash .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid #3b82f6;
        border-top-color: transparent;
        border-radius: 9999px;
        animation: initial-splash-spin 0.8s linear infinite;
      }
      @keyframes initial-splash-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <title>GigTax</title>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash"><div class="spinner"></div></div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
