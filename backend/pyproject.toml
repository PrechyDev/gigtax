[tool.poetry]
package-mode = false
name = "backend"
version = "0.1.0"
description = "Financial Receipt and Statement Processing Backend"
authors = ["Author <preciousrobinsonokafor@gmail.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.10"
fastapi = "^0.111.0"
uvicorn = "^0.29.0"
sqlalchemy = "^2.0.30"
alembic = "^1.13.1"
psycopg2-binary = "^2.9.9"
pydantic = "^2.7.1"
pydantic-settings = "^2.2.1"
python-dotenv = "^1.0.1"
pandas = "^2.2.0"
pdfplumber = "^0.11.0"
pymupdf = "^1.24.0"
presidio-analyzer = "^2.2.35"
presidio-anonymizer = "^2.2.35"
instructor = "^1.2.0"
python-multipart = "^0.0.9"
google-genai = "*" 
litellm = "^1.60.0"
openpyxl = "^3.1.5"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
